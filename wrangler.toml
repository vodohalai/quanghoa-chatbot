name = "quanghoa-chatbot"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "sale-agent-messenger-db"
database_id = "8b94b508-2225-4c41-b9e1-2eeebcaea665"

[[kv_namespaces]]
binding = "KV"
id = "9bfa6e93f84d48e3bce149bf6668053b"

[[r2_buckets]]
binding = "R2"
bucket_name = "quanghoa-images"

[vars]
# Thay thế các giá trị này sau khi setup Facebook App
FB_VERIFY_TOKEN = "REPLACE_WITH_YOUR_VERIFY_TOKEN"
# Thêm secret vào wrangler secret (không đặt ở đây):
# wrangler secret put FB_PAGE_ACCESS_TOKEN
# wrangler secret put ADMIN_PASSWORD
# wrangler secret put ADMIN_SECRET_KEY

[observability]
enabled = true
